<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About Me</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b4f8f;--card:#c2e0ff;--ink:#0b4a86;--tx:#0b4a86;--soft:#3069ab;--font:'DotGothic16','Pixelify Sans','Noto Sans KR',monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--font);padding:18px 14px 60px}
#bar,#card{max-width:880px;margin:0 auto;background:var(--card)}
#bar{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:13px}
.sw{width:22px;height:22px;border-radius:50%;padding:0}
select,button,input[type=color]{font:inherit;font-size:13px;color:var(--tx);background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:3px 7px;cursor:pointer}
input[type=color]{padding:0;width:28px;height:26px}
button:hover{background:var(--ink);color:var(--card)}
#card{border-radius:14px;padding:22px;box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:10px solid var(--ink);padding-bottom:6px;margin-bottom:18px}
h1{margin:0;font-size:clamp(40px,10vw,84px);line-height:1;font-weight:400;white-space:nowrap;font-kerning:none;font-feature-settings:'kern' 0,'palt' 0;letter-spacing:.04em;text-rendering:geometricPrecision}
.bcw{width:min(38%,260px)}
#bcsvg svg{display:block;width:100%;height:46px;fill:var(--ink)}
#bcin{width:100%;border:0;background:transparent;color:var(--tx);font:inherit;font-size:12px;letter-spacing:.3em;text-align:center;padding:2px}
body.edit #bcin{outline:2px dashed var(--soft)}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}

.box{border:3px solid var(--ink);padding:14px 16px}
.box h2{margin:0 0 12px;font-size:20px;font-weight:500;border-bottom:4px solid var(--ink);padding-bottom:6px}
.sec{margin:14px 0 4px;font-size:15px}.row{margin:8px 0;font-size:15px;line-height:1.7}
.photo{border:3px solid var(--ink);aspect-ratio:3/4;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px}
.photo img,.im img{width:100%;height:100%;object-fit:cover;display:block}
.cap{text-align:right;font-size:14px;margin-top:6px}
.links{margin-top:20px;display:grid;gap:10px}
.lk{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);padding:10px 14px;font-size:16px;color:var(--tx);text-decoration:none;background:var(--card);box-shadow:4px 4px 0 var(--soft)}
.lk .t{flex:1;text-align:center}.lk button{padding:0 6px;font-size:12px}
.foot{height:26px;background:var(--ink);margin-top:22px}
/* blocks */
#blocks{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:22px}
.blk{border:3px solid var(--ink);padding:12px;min-width:0;background:var(--card);box-shadow:4px 4px 0 var(--soft)}
.xs{grid-column:span 3}.s{grid-column:span 4}.m{grid-column:span 6}.l{grid-column:span 8}.xl{grid-column:span 12}

.ctl{display:none;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pg{display:grid;gap:6px}.im{position:relative;aspect-ratio:1;border:2px solid var(--ink);overflow:hidden}
.im button,.ctl button{padding:0 6px}.im button{position:absolute;top:3px;right:3px}
.bt{margin-top:10px;font-size:14px;line-height:1.7}.tx{white-space:pre-wrap;word-break:break-word;min-height:1em}
body.edit .tx:empty:before{content:attr(data-ph);opacity:.5}
body:not(.edit) .tx:empty{display:none}
.sd{display:flex;flex-wrap:wrap;gap:12px}.sdp{flex:1 1 130px}.sd .bt{flex:1 1 130px;margin:0}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}.sl{flex:0 0 100%;scroll-snap-align:start;padding-right:1px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:8px;height:8px;border-radius:50%;border:2px solid var(--ink)}.dots i.on{background:var(--ink)}
.mu{display:inline-block;margin:6px 6px 0 0;border:2px solid var(--ink);padding:2px 9px;color:var(--tx);text-decoration:none;font-size:13px;border-radius:99px}
.ed,.only-edit{display:none}
body.edit .ed{display:inline-block}body.edit .only-edit{display:block}body.edit .ctl{display:flex}
body.edit [contenteditable=true]{outline:2px dashed var(--soft);outline-offset:2px;cursor:text}
body:not(.edit) .lk button{display:none}
#mo{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:16px}
.md{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:18px;width:min(380px,100%);box-shadow:6px 6px 0 var(--soft)}
.md h3{margin:0 0 8px;font-size:17px;font-weight:500}.md p{margin:0 0 10px;font-size:13px;line-height:1.6}
.mi{display:block;width:100%;margin-bottom:10px;border:2px solid var(--ink);border-radius:99px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;padding:8px 14px;outline:0}
.mi::placeholder{color:var(--tx);opacity:.35}
.er{color:#c0392b;font-size:12px;margin:-4px 0 8px 6px}.er:empty{display:none}
.mb{display:flex;gap:8px;justify-content:flex-end}.mb button{border-radius:99px;padding:5px 16px}
.im .nv{top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;padding:0;font-size:18px;line-height:1;opacity:.92}
.im .nv.pv{left:6px;right:auto}.im .nv.nx{right:6px}
.ph .im{aspect-ratio:4/3}
.blk.hf{grid-column:span 12!important}
.hf .bd{display:flex;flex-direction:column;overflow:hidden;min-height:150px}
.hf.xl .bd{aspect-ratio:1/1}.hf.l .bd{aspect-ratio:3/2}.hf.m .bd{aspect-ratio:2/1}.hf.s .bd{aspect-ratio:3/1}.hf.xs .bd{aspect-ratio:4/1}
.hf .im{aspect-ratio:auto;height:auto}.hf .im img{position:absolute;inset:0}
.hf .pg{flex:1;min-height:0;display:flex}.hf .pg .im{flex:1;min-width:0}
.hf .sd{flex:1;min-height:0;flex-wrap:nowrap}.hf .sdp{flex:1.2;min-width:0;display:flex}.hf .sdp .pg{flex:1}
.hf .bt{overflow:auto;min-height:0}.hf .car{flex:1;min-height:0}.hf .sl{display:flex;flex-direction:column;height:100%}.hf .sl .im{flex:1;min-height:0}
.blk{overflow:hidden}.ctl select{max-width:100%;min-width:0}.sl,.car{min-width:0;max-width:100%}
.mu{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.xs .im .nv{width:22px;height:22px;font-size:14px}.xs .ctl button{padding:0 4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:15px;line-height:1.7;margin:8px 0}.cols>div{min-width:0}
.lk.yt{flex-wrap:wrap}.lk .ytm,.ytf{flex:0 0 100%;width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--ink)}.ytf{display:flex;align-items:center;justify-content:center;font-size:14px}
.cd{display:flex;flex-wrap:wrap;gap:12px}.cd .box{flex:1.5 1 150px;min-width:0;padding:10px 12px}.cdp{flex:1 1 120px;min-width:0;display:flex;flex-direction:column}
.hf .cd{flex:1;min-height:0;flex-wrap:nowrap}.hf .cd .box{overflow:auto}.hf .cdp .pg{flex:1}
.cd .links{margin-top:10px}.cd .lk{font-size:14px;padding:8px 10px}
.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px;align-content:start}
.ce{display:flex;gap:8px;border:2px solid var(--ink);padding:6px;min-width:0}
.ce .im{flex:0 0 42%;aspect-ratio:1;height:auto}.ce .bt{margin:0;flex:1;min-width:0;font-size:13px}
.hf .cl{flex:1;min-height:0;overflow:auto}
.pl{border-radius:99px;padding:2px 10px;margin:6px 6px 0 0;font-size:13px}.pw{flex-basis:100%}
.tg{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;border:2px solid var(--ink);background:var(--card);position:relative;vertical-align:middle;cursor:pointer;margin:0 6px 0 0}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:left .15s}
.tg:checked{background:var(--ink)}.tg:checked::after{left:18px;background:var(--card)}
.tg:disabled{opacity:.35;filter:grayscale(1);cursor:not-allowed}
h1 .so{width:.8em;height:.8em;fill:var(--ink);vertical-align:-.05em;margin:0 .02em}
.rt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.rt button.on{background:var(--ink);color:var(--card)}
#bar{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px}
.cg{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;overflow:hidden;white-space:nowrap}
.cg>*{flex:none}.cg b{font-size:13px}.cg label{display:flex;align-items:center;gap:4px;font-size:12px}
#sws{display:flex;gap:4px}.cg .sw{width:18px;height:18px}
.cg select{font-size:12px;padding:2px 4px;max-width:140px}.cg input[type=color]{width:24px;height:22px}
.ag{display:flex;flex-wrap:wrap;gap:8px}
body.edit #top [data-e]:empty{min-height:1.7em}body.edit #top [data-e]:empty:before{content:'輸入文字…';opacity:.4}
body:not(.edit) #top [data-e]:empty{display:none}
#vb{display:none;max-width:880px;margin:0 auto 12px;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
#vb a{color:var(--tx)}.view #vb{display:flex}.view #bar,.view .only-edit{display:none!important}
</style>
</head>
<body>
<div id="bar">
  <div class="cg"><b>✦ 設定</b><span id="sws"></span>
  <label>背景 <input type="color" id="cbg" value="#0b4f8f"></label>
  <label>卡片 <input type="color" id="ccard" value="#c2e0ff"></label>
  <label>框線 <input type="color" id="cink" value="#0b4a86"></label>
  <label>文字 <input type="color" id="ctx" value="#0b4a86"></label>
  <label>字體 <select id="font">
    <option value="'DotGothic16','Pixelify Sans','Noto Sans KR',monospace">像素 DotGothic</option>
    <option value="'Pixelify Sans','DotGothic16','Noto Sans KR',monospace">像素 Pixelify</option>
    <option value="'Zen Maru Gothic','Noto Sans KR','Noto Sans TC',sans-serif">圓體</option>
    <option value="'Noto Serif TC','Noto Serif KR',serif">明體</option>
    <option value="system-ui,'Noto Sans TC','Noto Sans KR',sans-serif">系統預設</option></select></label></div>
  <div class="ag"><button id="tog">✎ 編輯模式：關</button><button id="rst">重設</button><button id="lg">👤 登入／註冊</button><button id="sv">☁ 儲存到雲端</button></div>
</div>
<div id="vb"><a href="?">✦ 建立我的頁面</a></div>
<div id="card">
  <div class="head"><h1 id="ttl">ABOUT Me</h1>
    <div class="bcw"><div id="bcsvg"></div><input id="bcin" maxlength="20" inputmode="numeric" title="輸入你喜歡的數字" readonly></div></div>
  <div class="only-edit tt" style="margin:-6px 0 14px"><input id="ttin" class="mi" placeholder="標題文字" style="max-width:240px;display:inline-block;width:auto;margin:0 10px 0 0"><label style="font-size:13px"><input type="checkbox" class="tg" id="stsw">把 O 換成星星</label></div>
  <div id="top">
    <div class="grid">
      <div class="box">
        <h2 data-e>JUST FOR A BRIEF INTRODUCTION :)</h2>
        <div class="sec" data-e>＊KPOP</div>
        <div class="cols"><div data-e></div><div data-e></div><div data-e></div><div data-e></div></div>
        <div class="sec" data-e>＊OTHERS</div>
        <div class="row" data-e></div>
        <div class="row" data-e></div>
      </div>
      <div><div class="photo" id="photo" title="點擊上傳照片"><span>＋ 點擊上傳大頭照</span></div>
        <div class="cap" data-e></div></div>
    </div>
    <div class="links" id="links">
      <a class="lk" href="#"><span class="t" data-e>Instagram</span><button class="ed" data-a="url">網址</button><button class="ed" data-a="dl">×</button></a>
    </div>
  </div>
  <button class="only-edit" id="addlk" style="margin-top:10px">＋ 新增連結</button>
  <div id="blocks"></div>
  <button class="only-edit" id="addb" style="margin-top:14px">＋ 新增區塊</button>
  <div class="foot"></div>
</div>
<input type="file" accept="image/*" id="f" hidden multiple>
<div id="mo"></div>
<script>
var $=function(s){return document.querySelector(s)},KEY='aboutme-v2',EDIT=false,T='main';
var S={bc:'20260521',b:[{s:'xl',l:'grid',p:[],t:'這是一個區塊。打開「編輯模式」後，可以調整大小、排版、加照片與音樂 :)',m:null}]};
var OR={v:'直式（方形照片）',p:'橫幅照片（4:3）',f:'橫向滿版（占滿一行）'};var SZ={xs:'極小 1/4',s:'小 1/3',m:'中 1/2',l:'大 2/3',xl:'極大 全寬'};
var LY={grid:'照片組＋下方文字',side:'照片＋旁邊文字',one:'滑動相簿・整組一段文字',each:'滑動相簿・每張各一段文字',card:'圖鑑卡（標題＋照片＋連結，同預設圖塊）',cells:'一格一格：每張照片＋旁邊文字'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function opts(o,v){return Object.keys(o).map(function(k){return '<option value="'+k+'"'+(k==v?' selected':'')+'>'+o[k]+'</option>'}).join('')}
function tx(b,i,v,f){return '<div class="tx" data-b="'+b+'" data-i="'+i+(f?'" data-f="'+f:'')+'" data-ph="輸入文字…" contenteditable="'+EDIT+'">'+esc(v)+'</div>'}
function mu(m,b,i){var e=m&&embedOf(m.u);return (m?'<a class="mu" href="'+esc(m.u)+'" target="_blank" rel="noopener">♪ '+esc(m.n||plat(m.u))+'</a>':'')+(e?'<button class="pl" data-a="pl" data-em="'+esc(e[0])+'" data-h="'+e[1]+'">▶ 播放</button>':'')+'<button class="ed" data-a="mu" data-b="'+b+'" data-i="'+i+'">♪ '+(m?'改':'加')+'音樂</button>'+(e?'<div class="pw"></div>':'')}
function im(x,b,k,n,c){return '<div class="im"><img src="'+esc(x.i)+'" alt="">'+(c&&n>1?(k?'<button class="nv pv" data-a="pv" aria-label="上一張">‹</button>':'')+(k<n-1?'<button class="nv nx" data-a="nx" aria-label="下一張">›</button>':''):'')+'<button class="ed" data-a="rp" data-b="'+b+'" data-i="'+k+'">×</button></div>'}
function block(b,i){
  var p=b.p,body,n=p.length;
  if(b.l=='grid'||b.l=='side'){
    var c=n<2?1:(n==2||n==4?2:3),g='<div class="pg" style="grid-template-columns:repeat('+c+',1fr)">'+p.map(function(x,k){return im(x,i,k)}).join('')+'</div>';
    var t='<div class="bt">'+tx(i,-1,b.t)+mu(b.m,i,-1)+'</div>';
    body=b.l=='grid'?(n?g:'')+t:'<div class="sd">'+(n?'<div class="sdp">'+g+'</div>':'')+t+'</div>';
  }else if(b.l=='cells'){body='<div class="cl">'+p.map(function(x,k){return '<div class="ce">'+im(x,i,k)+'<div class="bt">'+tx(i,k,x.t)+'</div></div>'}).join('')+'</div><div class="bt">'+mu(b.m,i,-1)+'</div>';
  }else if(b.l=='card'){var g=n?'<div class="pg" style="grid-template-columns:repeat('+(n<2?1:2)+',1fr)">'+p.map(function(x,k){return im(x,i,k)}).join('')+'</div>':'';
    body='<div class="cd"><div class="box"><h2>'+tx(i,-1,b.ti,'ti')+'</h2>'+tx(i,-1,b.t)+'<div class="links">'+(b.k||[]).map(function(x,j){return lk(x,i,j)}).join('')+'</div></div><div class="cdp">'+g+'<div class="cap">'+tx(i,-1,b.cp,'cp')+'</div></div></div>';
  }else{
    body='<div class="car">'+p.map(function(x,k){return '<div class="sl">'+im(x,i,k,n,1)+(b.l=='each'?'<div class="bt">'+tx(i,k,x.t)+mu(x.m,i,k)+'</div>':'')+'</div>'}).join('')+'</div>'
      +'<div class="dots">'+p.map(function(_,k){return '<i'+(k?'':' class="on"')+'></i>'}).join('')+'</div>'
      +(b.l=='one'?'<div class="bt">'+tx(i,-1,b.t)+mu(b.m,i,-1)+'</div>':'');
  }
  return '<div class="blk '+b.s+(b.o=='f'?' hf':b.o=='h'||b.o=='p'?' ph':'')+'"><div class="ctl" data-b="'+i+'"><select data-a="sz">'+opts(SZ,b.s)+'</select><select data-a="ly">'+opts(LY,b.l)+'</select><select data-a="or">'+opts(OR,b.o=='h'?'p':(b.o||'v'))+'</select>'
    +(b.l=='card'?'<button data-a="bka" data-b="'+i+'">＋連結</button>':'')+'<button data-a="ad" data-b="'+i+'">＋照片</button><button data-a="up" data-b="'+i+'">↑</button><button data-a="dn" data-b="'+i+'">↓</button><button data-a="rm" data-b="'+i+'">刪除</button></div><div class="bd">'+body+'</div></div>';
}
function render(){
  $('#blocks').innerHTML=S.b.map(block).join('');
  document.querySelectorAll('.car').forEach(function(c){c.onscroll=function(){var k=Math.round(c.scrollLeft/c.clientWidth);c.nextElementSibling.querySelectorAll('i').forEach(function(d,j){d.className=j==k?'on':''})}});
}
function bars(code){var x=3,r='<rect width="2" height="40"/>';String(code||'0').split('').forEach(function(ch){var d=+ch||0;for(var j=0;j<4;j++){var w=((d*3+j*5+d*j)%3)+1;if(j%2==0)r+='<rect x="'+x+'" width="'+w+'" height="40"/>';x+=w}x+=1});r+='<rect x="'+x+'" width="2" height="40"/>';return '<svg viewBox="0 0 '+(x+2)+' 40" preserveAspectRatio="none">'+r+'</svg>'}
function drawBC(){$('#bcsvg').innerHTML=bars(S.bc);$('#bcin').value=S.bc}
$('#bcin').oninput=function(){S.bc=this.value.replace(/\D/g,'').slice(0,20)||'0';drawBC();save()};
function save(){if(window.VIEW)return;try{S.h=$('#top').innerHTML;S.st=document.documentElement.getAttribute('style')||'';S.f=$('#font').value;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setEdit(on){EDIT=on;document.body.classList.toggle('edit',on);$('#bcin').readOnly=!on;document.querySelectorAll('#top [data-e]').forEach(function(e){e.setAttribute('contenteditable',on)});$('#tog').textContent='✎ 編輯模式：'+(on?'開':'關');render()}
$('#tog').onclick=function(){setEdit(!EDIT);save()};
/* themes */
var themes=[['#0b4f8f','#c2e0ff','#0b4a86'],['#7a2b52','#ffd9ec','#7a2b52'],['#2f5d3a','#d8f2d4','#2f5d3a'],['#4a3a8a','#e3dcff','#4a3a8a'],['#f3e9d8','#fffaf0','#4a3a2a'],['#15161a','#2a2c33','#e8e8f0']];
function lum(h){var n=parseInt(h.slice(1),16);return (n>>16)*.3+((n>>8)&255)*.59+(n&255)*.11}
function setTheme(bg,c,ink,tx){var r=document.documentElement.style;ink=ink||(lum(c)>140?'#0b2f57':'#e8f1ff');tx=tx||ink;r.setProperty('--bg',bg);r.setProperty('--card',c);r.setProperty('--ink',ink);r.setProperty('--soft',ink);r.setProperty('--tx',tx);syncC();save()}
$('#sws').innerHTML='';themes.forEach(function(t){var b=document.createElement('button');b.className='sw';b.style.background='linear-gradient(135deg,'+t[0]+' 50%,'+t[1]+' 50%)';b.onclick=function(){setTheme(t[0],t[1],t[2])};$('#sws').appendChild(b)});
$('#cbg').oninput=$('#ccard').oninput=$('#cink').oninput=$('#ctx').oninput=function(){setTheme($('#cbg').value,$('#ccard').value,$('#cink').value,$('#ctx').value)};
